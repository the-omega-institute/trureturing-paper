name: paper-ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Trureturing.Paper.slnx --ignore-failed-sources

      - name: Build (Release; warnings are errors)
        run: dotnet build Trureturing.Paper.slnx -c Release --no-restore

      - name: Test (Release, including real blessed-snapshot acceptance)
        run: dotnet test Trureturing.Paper.slnx -c Release --no-build --no-restore
