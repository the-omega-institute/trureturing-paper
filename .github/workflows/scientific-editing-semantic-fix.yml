name: scientific-editing-semantic-fix

on:
  push:
    branches:
      - codex/paper-scientific-native-editing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-scientific-native-editing
          fetch-depth: 0
      - name: Bind edit delta to admitted source bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Trureturing.Paper.Core/PaperScientificEditingAgents.cs')
          source = path.read_text()

          source, first = re.subn(
              r'(PaperScientificEditDelta delta = ComputeScientificEditDelta\(\s*context\.SourceDraft,\s*)(editDraft,)',
              r'\1dispatch.SourceDraftRef,\n            \2',
              source,
              count=1)
          source, second = re.subn(
              r'(private static PaperScientificEditDelta ComputeScientificEditDelta\(\s*PaperScientificManuscriptDraft source,\s*)(PaperScientificEditDraft edited,)',
              r'\1string sourceDraftRef,\n        \2',
              source,
              count=1)
          source, third = re.subn(
              r'Reference\(CanonicalJson\.Serialize\(source\)\),(\s*editedDraftRef,)',
              r'sourceDraftRef,\1',
              source,
              count=1)
          source, fourth = re.subn(
              r'if \(oldBlock\.Kind is PaperManuscriptDraftBlockKinds\.FormalClaim\s*or PaperManuscriptDraftBlockKinds\.InformalItem\s*&&',
              'if ((oldBlock.Kind is PaperManuscriptDraftBlockKinds.FormalClaim\n                    or PaperManuscriptDraftBlockKinds.InformalItem)\n                    &&',
              source,
              count=1)
          source, fifth = re.subn(
              r'context\.SourceTask\.Schema == PaperAgentSchemas\.Task \? context\.SourceAuthoringCursor\.TaskRef : string\.Empty',
              'context.SourceAuthoringCursor.TaskRef',
              source,
              count=1)

          if (first, second, third, fourth, fifth) != (1, 1, 1, 1, 1):
              raise SystemExit(
                  f'scientific editing semantic patch counts: {(first, second, third, fourth, fifth)}')
          path.write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperScientificEditingAgents.cs
          git commit -m "fix(paper): bind scientific edit delta to admitted source"
          git push origin HEAD:codex/paper-scientific-native-editing
