name: portfolio-judgment-build-fix

on:
  push:
    branches:
      - codex/paper-portfolio-native-judgment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-portfolio-native-judgment
          fetch-depth: 0
      - name: Correct scorecard dictionary value type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Trureturing.Paper.Core/PaperPortfolioJudgmentAgents.cs')
          text = path.read_text()
          pattern = re.compile(
              r'var scorecards = context\.Papers\.ToDictionary\(\s*'
              r'paper => paper\.Scorecard\.ScorecardId,\s*'
              r'StringComparer\.Ordinal\);')
          replacement = '''var scorecards = context.Papers.ToDictionary(
            paper => paper.Scorecard.ScorecardId,
            paper => paper.Scorecard,
            StringComparer.Ordinal);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('scorecard dictionary target not found')
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperPortfolioJudgmentAgents.cs
          git commit -m "fix(paper): bind portfolio scorecard values explicitly"
          git push origin HEAD:codex/paper-portfolio-native-judgment
