name: portfolio-judgment-build-fix

on:
  push:
    branches:
      - codex/paper-portfolio-native-judgment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-portfolio-native-judgment
          fetch-depth: 0
      - name: Correct scorecard dictionary value type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Trureturing.Paper.Core/PaperPortfolioJudgmentAgents.cs')
          text = path.read_text()
          old = '''        var scorecards = context.Papers.ToDictionary(
            paper => paper.Scorecard.ScorecardId,
            StringComparer.Ordinal);'''
          new = '''        var scorecards = context.Papers.ToDictionary(
            paper => paper.Scorecard.ScorecardId,
            paper => paper.Scorecard,
            StringComparer.Ordinal);'''
          if old not in text:
              raise SystemExit('scorecard dictionary target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperPortfolioJudgmentAgents.cs
          git commit -m "fix(paper): bind portfolio scorecard values explicitly"
          git push origin HEAD:codex/paper-portfolio-native-judgment
