name: frontier-planning-compile-fix

on:
  push:
    branches:
      - codex/paper-frontier-native-planning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-frontier-native-planning
          fetch-depth: 0
      - name: Apply nullable and globalization fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          storage = Path('src/Trureturing.Paper.Core/PaperFrontierPlanningAgentStorage.cs')
          text = storage.read_text()
          if not text.startswith('namespace Trureturing.Paper.Core;'):
              raise SystemExit('unexpected storage header')
          storage.write_text('using System.Globalization;\n\n' + text)

          validation = Path('src/Trureturing.Paper.Core/PaperFrontierPlanningAgentValidation.cs')
          text = validation.read_text()
          old_a = 'claimIds.Add(spec.ClaimId)'
          old_b = 'claims.Add(route.ClaimId)'
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit('nullable targets not found exactly once')
          text = text.replace(old_a, 'claimIds.Add(spec.ClaimId!)', 1)
          text = text.replace(old_b, 'claims.Add(route.ClaimId!)', 1)
          validation.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperFrontierPlanningAgentStorage.cs src/Trureturing.Paper.Core/PaperFrontierPlanningAgentValidation.cs
          git commit -m "fix(paper): satisfy frontier planner strict compilation"
          git push origin HEAD:codex/paper-frontier-native-planning
