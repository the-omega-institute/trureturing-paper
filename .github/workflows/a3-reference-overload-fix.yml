name: a3-reference-overload-fix

on:
  push:
    branches: [codex/paper-a3-native-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-a3-native-audit
          fetch-depth: 0
      - name: Separate canonical-object and raw-byte references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Trureturing.Paper.Core/PaperTheoryAuditAgents.cs')
          text = path.read_text()
          replacements = {
              '            Reference(planContent),': '            ContentReference(planContent),',
              '        string opinionId = Reference(opinion);': '        string opinionId = ContentReference(opinion);',
              '    private static string Reference<T>(T value) =>\n        CanonicalJson.Sha256Reference(CanonicalJson.Serialize(value));': '    private static string ContentReference<T>(T value) =>\n        CanonicalJson.Sha256Reference(CanonicalJson.Serialize(value));',
              '        if (!string.Equals(reference, Reference(content), StringComparison.Ordinal))': '        if (!string.Equals(reference, ContentReference(content), StringComparison.Ordinal))',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'A3 hash replacement missing or ambiguous: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/a3-reference-overload-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Trureturing.Paper.Core/PaperTheoryAuditAgents.cs .github/workflows/a3-reference-overload-fix.yml
          git commit -m "fix(paper): separate A3 content and byte identities"
          git push origin HEAD:codex/paper-a3-native-audit
