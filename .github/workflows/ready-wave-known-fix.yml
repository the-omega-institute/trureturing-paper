name: ready-wave-known-fix

on:
  push:
    branches:
      - codex/paper-frontier-ready-wave-selection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-frontier-ready-wave-selection
          fetch-depth: 0
      - name: Correct ready-wave replay fixture and remove patch workflow
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python -c 'from pathlib import Path; p=Path("tests/Trureturing.Paper.Tests/PaperFrontierReadyWaveSelectionTests.cs"); s=p.read_text(); assert s.count("repository.Frier.FrontierId")==1; p.write_text(s.replace("repository.Frier.FrontierId","repository.Frontier.FrontierId",1))'
          git rm .github/workflows/ready-wave-known-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/Trureturing.Paper.Tests/PaperFrontierReadyWaveSelectionTests.cs
          git commit -m "test(paper): correct ready-wave replay frontier reference"
          git push origin HEAD:codex/paper-frontier-ready-wave-selection
