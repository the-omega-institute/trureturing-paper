name: ready-wave-selection-generalize

on:
  push:
    branches:
      - codex/paper-frontier-ready-wave-selection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-frontier-ready-wave-selection
          fetch-depth: 0
      - name: Generalize later-wave validators and contracts
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python -c 'from pathlib import Path; p=Path("src/Trureturing.Paper.Core/PaperFrontierNodeSelectionValidation.cs"); s=p.read_text(); assert s.count("content.ParallelWave != 0")==1; assert s.count("cursor.ParallelWave != 0")==1; s=s.replace("content.ParallelWave != 0","content.ParallelWave < 0",1).replace("cursor.ParallelWave != 0","cursor.ParallelWave < 0",1); p.write_text(s)'
          python -c 'from pathlib import Path; paths=["contracts/paper-frontier-node-selection-authorization.v1.schema.json","contracts/paper-frontier-node-selection-cursor.v1.schema.json","contracts/paper-frontier-node-selection-admitted.v1.schema.json","contracts/paper-frontier-node-selection-ready.v1.schema.json"]; old="\"parallel_wave\": { \"const\": 0 }"; new="\"parallel_wave\": { \"type\": \"integer\", \"minimum\": 0 }"; [(lambda p,s: (p.write_text(s.replace(old,new,1)) if s.count(old)==1 else (_ for _ in ()).throw(AssertionError(str(p)))))(Path(x),Path(x).read_text()) for x in paths]'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperFrontierNodeSelectionValidation.cs contracts/paper-frontier-node-selection-authorization.v1.schema.json contracts/paper-frontier-node-selection-cursor.v1.schema.json contracts/paper-frontier-node-selection-admitted.v1.schema.json contracts/paper-frontier-node-selection-ready.v1.schema.json
          git commit -m "feat(paper): allow governed selections in later frontier waves"
          git push origin HEAD:codex/paper-frontier-ready-wave-selection
