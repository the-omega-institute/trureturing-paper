name: frontier-completion-patch

on:
  push:
    branches:
      - codex/paper-frontier-completion-manuscript-plan

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-frontier-completion-manuscript-plan
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply completion patch and verify build
        shell: bash
        run: |
          python tools/frontier_completion_patch.py
          dotnet restore Trureturing.Paper.slnx --ignore-failed-sources
          dotnet build Trureturing.Paper.slnx -c Release --no-restore
      - name: Commit patched completion implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(paper): finalize frontier completion and release coherence"
          git push origin HEAD:codex/paper-frontier-completion-manuscript-plan
