name: native-agent-source-fix

on:
  push:
    branches:
      - codex/paper-fkst-native-agent-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-fkst-native-agent-runtime
          fetch-depth: 0

      - name: Apply exact source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "src/Trureturing.Paper.Core/PaperAgentRuntime.cs",
              "            provenance,\n            result.CompletedAt);",
              "            provenance!,\n            result.CompletedAt);")

          replace_exact(
              "src/Trureturing.Paper.Core/PaperTheoryPortfolioProposals.cs",
              "out PaperTheoremPackageClaim claim",
              "out PaperTheoremPackageClaim? claim")

          replace_exact(
              "src/Trureturing.Paper.Core/PaperTheoryFoundation.cs",
              "out PaperTheoryClaimInventoryItem item",
              "out PaperTheoryClaimInventoryItem? item")

          replace_exact(
              "src/Trureturing.Paper.Core/PaperTheoryDeepening.cs",
              "out PaperTheoremPackageClaim claim",
              "out PaperTheoremPackageClaim? claim",
              expected=2)

          decisions = Path("src/Trureturing.Paper.Core/PaperPortfolioDecisions.cs")
          text = decisions.read_text()
          marker = "        foreach (PaperCandidateScorecard scorecard in scorecards)\n"
          start = text.index(marker)
          end = text.index("\n\n        PaperCandidateScorecard[] ranked", start)
          segment = text[start:end]
          declaration = "PaperCandidateScorecardContent content = scorecard.ScorecardContent;"
          if segment.count(declaration) != 1:
              raise SystemExit("PaperPortfolioDecisions.cs: inner scorecard content declaration changed")
          segment = segment.replace(
              declaration,
              "PaperCandidateScorecardContent scorecardContent = scorecard.ScorecardContent;")
          segment = segment.replace("content.", "scorecardContent.")
          decisions.write_text(text[:start] + segment + text[end:])

          Path(".github/workflows/native-agent-source-fix.yml").unlink()
          PY

      - name: Commit corrected sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(paper): resolve stacked nullable and scope build errors"
          git push origin HEAD:codex/paper-fkst-native-agent-runtime
