name: runtime-retarget-test-fix

on:
  push:
    branches:
      - codex/paper-fkst-native-agent-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-fkst-native-agent-runtime
          fetch-depth: 0
      - name: Align A2 rejection assertion with merged validator
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("tests/Trureturing.Paper.Tests/PaperTheoryDeepeningTests.cs"); s=p.read_text(); old="Assert.Contains(\"progress evidence counters\", error.Message, StringComparison.OrdinalIgnoreCase);"; new="Assert.Contains(\"no structural, abstraction, novelty, or counterexample progress\", error.Message, StringComparison.OrdinalIgnoreCase);"; assert old in s; p.write_text(s.replace(old, new, 1))'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/Trureturing.Paper.Tests/PaperTheoryDeepeningTests.cs
          git commit -m "test(paper): align runtime retarget rejection assertion"
          git push origin HEAD:codex/paper-fkst-native-agent-runtime
