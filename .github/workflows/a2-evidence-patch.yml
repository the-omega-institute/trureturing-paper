name: a2-evidence-patch

on:
  push:
    branches:
      - codex/paper-a2-native-agent

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-a2-native-agent
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/a2_evidence_patch.py
      - name: Commit patch and remove temporary files
        run: |
          rm tools/a2_evidence_patch.py
          rm .github/workflows/a2-evidence-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Trureturing.Paper.Core/PaperTheoryDeepening.cs tests/Trureturing.Paper.Tests/PaperTheoryDeepeningAgentTests.cs docs/FKST_A2_NATIVE_AGENT.md tools/a2_evidence_patch.py .github/workflows/a2-evidence-patch.yml
          git commit -m "fix(paper): bind A2 to the full research evidence closure"
          git push origin HEAD:codex/paper-a2-native-agent
