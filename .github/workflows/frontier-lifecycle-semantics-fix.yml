name: frontier-lifecycle-semantics-fix

on:
  push:
    branches:
      - codex/paper-frontier-formalization-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-frontier-formalization-lifecycle
          fetch-depth: 0
      - name: Record descendant certification release on frontier state
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/Trureturing.Paper.Core/PaperFormalizationFrontierLifecycle.cs"); s=p.read_text(); old="            if (!string.Equals(\n                    certifiedTruthReleaseDigest,\n                    frontier.FrontierContent.TruthReleaseDigest,\n                    StringComparison.Ordinal))\n            {\n                throw new InvalidDataException(\n                    \"Frontier certification must join the exact truth release used by the paper program.\");\n            }"; new="            if (string.Equals(\n                    certifiedTruthReleaseDigest,\n                    frontier.FrontierContent.TruthReleaseDigest,\n                    StringComparison.Ordinal))\n            {\n                throw new InvalidDataException(\n                    \"Frontier certification must identify a later descendant truth release.\");\n            }"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("tests/Trureturing.Paper.Tests/PaperFormalizationFrontierTests.cs"); s=p.read_text(); old="        state = Apply(\n            frontier,\n            state,\n            node,\n            PaperFormalizationFrontierLifecycleService.TruthReleaseCertificationFamily,\n            \"paper-truth-release-certification.v1\",\n            \"certification\",\n            \"\",\n            frontier.FrontierContent.TruthReleaseDigest,\n            \"candidate joined to exact truth release\",\n            \"2026-08-31T06:00:00Z\");"; new="        string certifiedRelease =\n            PaperTheoryTestFactory.Digest(\"certified-later-release\");\n        state = Apply(\n            frontier,\n            state,\n            node,\n            PaperFormalizationFrontierLifecycleService.TruthReleaseCertificationFamily,\n            \"paper-truth-release-certification.v1\",\n            \"certification\",\n            \"\",\n            certifiedRelease,\n            \"candidate joined to a certified descendant truth release\",\n            \"2026-08-31T06:00:00Z\");"; assert old in s; s=s.replace(old,new,1); old2="        Assert.Equal(\n            frontier.FrontierContent.TruthReleaseDigest,\n            final.CertifiedTruthReleaseDigest);"; new2="        Assert.Equal(\n            certifiedRelease,\n            final.CertifiedTruthReleaseDigest);"; assert old2 in s; p.write_text(s.replace(old2,new2,1))'
          python -c 'from pathlib import Path; p=Path("tests/Trureturing.Paper.Tests/PaperFormalizationFrontierTests.cs"); s=p.read_text(); s=s.replace("public void CertificationRejectsDifferentTruthRelease()","public void CertificationRejectsUnchangedBaseTruthRelease()",1); old="                PaperTheoryTestFactory.Digest(\"different-truth-release\"),\n                \"attempted cross-release certification\","; new="                frontier.FrontierContent.TruthReleaseDigest,\n                \"attempted same-release certification\","; assert old in s; s=s.replace(old,new,1); old2="Assert.Contains(\"exact truth release\", error.Message, StringComparison.Ordinal);"; new2="Assert.Contains(\"later descendant truth release\", error.Message, StringComparison.Ordinal);"; assert old2 in s; p.write_text(s.replace(old2,new2,1))'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperFormalizationFrontierLifecycle.cs tests/Trureturing.Paper.Tests/PaperFormalizationFrontierTests.cs
          git commit -m "fix(paper): record descendant certification release on frontier"
          git push origin HEAD:codex/paper-frontier-formalization-lifecycle
