name: a0a1-source-fix

on:
  push:
    branches: [codex/paper-a0-a1-native-agents]
    paths: [.github/workflows/a0a1-source-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-a0-a1-native-agents
      - name: Apply focused source correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Trureturing.Paper.Core/PaperTheoryFoundationAgents.cs')
          text = path.read_text()
          text = text.replace(
              'ValidateTaskBinding(task, dispatch, dispatchRef, dispatchInput.RepositoryRelativePath);',
              'ValidateTaskBinding(root, task, dispatch, dispatchRef, dispatchInput.RepositoryRelativePath);')
          pattern = re.compile(
              r'    private static void ValidateTaskBinding\(.*?\n    private static void RequireInputSetExactly\(',
              re.S)
          replacement = '''    private static void ValidateTaskBinding(
        string root,
        PaperAgentTask task,
        PaperTheoryFoundationAgentDispatch dispatch,
        string dispatchRef,
        string dispatchRelativePath)
    {
        PaperAgentTask expected = dispatch.Kind switch
        {
            ScopeKind => BuildScopeTask(
                root,
                dispatch,
                dispatchRef,
                dispatchRelativePath,
                LoadScopeContext(root, dispatch)),
            InventoryKind => BuildInventoryTask(
                root,
                dispatch,
                dispatchRef,
                dispatchRelativePath,
                LoadInventoryContext(root, dispatch)),
            _ => throw new InvalidDataException(
                $"Unsupported theory-foundation dispatch kind {dispatch.Kind}.")
        };
        byte[] actualBytes = CanonicalJson.Serialize(task);
        byte[] expectedBytes = CanonicalJson.Serialize(expected);
        if (!actualBytes.AsSpan().SequenceEqual(expectedBytes))
        {
            throw new InvalidDataException(
                "Foundation-agent task changed its dispatch-owned contract.");
        }
    }

    private static void RequireInputSetExactly('''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('ValidateTaskBinding block was not found exactly once')
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperTheoryFoundationAgents.cs
          git diff --cached --quiet || git commit -m "fix(paper): validate reconstructed A0 A1 agent tasks"
          git push origin HEAD:codex/paper-a0-a1-native-agents
