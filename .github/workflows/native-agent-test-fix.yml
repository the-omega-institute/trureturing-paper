name: native-agent-test-fix

on:
  push:
    branches:
      - codex/paper-fkst-native-agent-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-fkst-native-agent-runtime
          fetch-depth: 0

      - name: Apply exact test expectation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "tests/Trureturing.Paper.Tests/PaperAgentRuntimeTests.cs",
              'Assert.Contains("agent_role", error.Message, StringComparison.OrdinalIgnoreCase);',
              'Assert.Contains("AgentRole", error.Message, StringComparison.OrdinalIgnoreCase);')

          replace_exact(
              "tests/Trureturing.Paper.Tests/PaperTheoryDeepeningTests.cs",
              'Assert.Contains("fake extension", error.Message, StringComparison.Ordinal);',
              'Assert.Contains("progress evidence counters", error.Message, StringComparison.OrdinalIgnoreCase);')

          Path(".github/workflows/native-agent-test-fix.yml").unlink()
          PY

      - name: Commit corrected expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(paper): align assertions with fail-closed diagnostics"
          git push origin HEAD:codex/paper-fkst-native-agent-runtime
