name: manuscript-authoring-finalize

on:
  push:
    branches:
      - codex/paper-manuscript-native-authoring

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-manuscript-native-authoring
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Finalize manuscript authoring implementation
        shell: bash
        run: |
          python tools/manuscript_authoring_finalize.py
          dotnet restore Trureturing.Paper.slnx --ignore-failed-sources
          dotnet build Trureturing.Paper.slnx -c Release --no-restore
          dotnet test Trureturing.Paper.slnx -c Release --no-build --no-restore
          dotnet build tools/Trureturing.Paper.ResearchInput.Cli/Trureturing.Paper.ResearchInput.Cli.csproj -c Release
          dotnet run --project tests/Trureturing.Paper.ResearchInputTests -c Release
          make -C tools/research_pipeline test
      - name: Commit finalized authoring path
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(paper): finalize FKST-native manuscript authoring"
          git push origin HEAD:codex/paper-manuscript-native-authoring
