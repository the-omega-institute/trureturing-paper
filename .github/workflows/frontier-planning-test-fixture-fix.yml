name: frontier-planning-test-fixture-fix

on:
  push:
    branches:
      - codex/paper-frontier-native-planning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-frontier-native-planning
          fetch-depth: 0
      - name: Write strict result envelope without a byte-order mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/Trureturing.Paper.Tests/PaperFrontierPlanningAgentTests.cs')
          text = path.read_text()
          old = 'File.WriteAllText(stdoutPath, text, Encoding.UTF8);'
          new = 'File.WriteAllBytes(stdoutPath, Encoding.UTF8.GetBytes(text));'
          if text.count(old) != 1:
              raise SystemExit('stdout fixture target not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/Trureturing.Paper.Tests/PaperFrontierPlanningAgentTests.cs
          git commit -m "test(paper): write frontier result envelope without BOM"
          git push origin HEAD:codex/paper-frontier-native-planning
