name: a3-inbox-path-fix

on:
  push:
    branches: [codex/paper-a3-native-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-a3-native-audit
          fetch-depth: 0
      - name: Permit owned agent inbox paths in A3 plans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Trureturing.Paper.Core/PaperTheoryAuditAgents.cs')
          text = path.read_text()
          old = '["artifacts", "Papers", "work", "contracts", "docs", "src", "tools", "tests"]'
          new = '["artifacts", "Papers", "work", "inbox", "contracts", "docs", "src", "tools", "tests"]'
          if text.count(old) != 1:
              raise SystemExit('A3 allowed-root block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/a3-inbox-path-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Trureturing.Paper.Core/PaperTheoryAuditAgents.cs .github/workflows/a3-inbox-path-fix.yml
          git commit -m "fix(paper): admit owned A3 reviewer task paths"
          git push origin HEAD:codex/paper-a3-native-audit
