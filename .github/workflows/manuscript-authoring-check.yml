name: manuscript-authoring-check

on:
  push:
    branches:
      - codex/paper-manuscript-native-authoring

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-manuscript-native-authoring
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply deterministic source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one target in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/Trureturing.Paper.Core/PaperManuscriptAuthoringAgents.cs',
              '''    public static void Validate(
                  PaperScientificManuscript manuscript,
                  PaperManuscriptAuthoringContext context,''',
              '''    internal static void Validate(
                  PaperScientificManuscript manuscript,
                  PaperManuscriptAuthoringContext context,''')
          replace(
              'src/Trureturing.Paper.Core/PaperManuscriptAuthoringAgents.cs',
              '''            dispatch.SelectedReleaseDigest,
                  dispatch.PaperId,
                  mainTex,''',
              '''            dispatch.SelectedReleaseDigest,
                  draft.Title,
                  mainTex,''')
          replace(
              'src/Trureturing.Paper.Core/PaperFrontierManuscriptAuthoringContext.cs',
              '''            || !string.Equals(
                      manifest.ManuscriptTruthReleaseRef,
                      selectedRelease.ReleaseDigest == string.Empty
                          ? string.Empty
                          : plan.ManuscriptTruthReleaseRef,
                      StringComparison.Ordinal))''',
              '''            || !string.Equals(
                      manifest.ManuscriptTruthReleaseRef,
                      plan.ManuscriptTruthReleaseRef,
                      StringComparison.Ordinal))''')

          validation = Path('src/Trureturing.Paper.Core/PaperManuscriptAuthoringValidation.cs')
          text = validation.read_text()
          if 'using System.Text.Json;\n' not in text:
              text = text.replace(
                  'using System.Text;\n',
                  'using System.Text;\nusing System.Text.Json;\n',
                  1)
          validation.write_text(text)

          rendering = Path('src/Trureturing.Paper.Core/PaperManuscriptRendering.cs')
          text = rendering.read_text()
          old = '''                || Count(source, $"\\\\label{{{binding.LatexLabel}}}") != 1
                          || Count(source, $"\\\\begin{{{binding.Environment}}}") != 1
                          || Count(source, $"\\\\end{{{binding.Environment}}}") != 1)'''
          new = '''                || Count(source, $"\\\\label{{{binding.LatexLabel}}}") != 1)'''
          if text.count(old) != 1:
              raise SystemExit('formal environment marker target not found')
          rendering.write_text(text.replace(old, new, 1))
          PY
      - run: dotnet restore Trureturing.Paper.slnx --ignore-failed-sources
      - run: dotnet build Trureturing.Paper.slnx -c Release --no-restore
      - run: dotnet test Trureturing.Paper.slnx -c Release --no-build --no-restore
      - name: Commit verified corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core
          git commit -m "fix(paper): align manuscript authoring visibility and bindings"
          git push origin HEAD:codex/paper-manuscript-native-authoring
