name: manuscript-authoring-check

on:
  push:
    branches:
      - codex/paper-manuscript-native-authoring

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Trureturing.Paper.slnx --ignore-failed-sources
      - run: dotnet build Trureturing.Paper.slnx -c Release --no-restore
      - run: dotnet test Trureturing.Paper.slnx -c Release --no-build --no-restore
