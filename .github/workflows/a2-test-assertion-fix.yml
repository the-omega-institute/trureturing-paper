name: a2-test-assertion-fix

on:
  push:
    branches: [codex/paper-a2-native-agent]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-a2-native-agent
          fetch-depth: 0
      - name: Align assertions with fail-closed diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Trureturing.Paper.Tests/PaperTheoryDeepeningAgentTests.cs')
          text = path.read_text()
          text = text.replace(
              '            "fake extension",\n            error.Message,\n            StringComparison.OrdinalIgnoreCase);',
              '            "repository-computed theorem-package delta",\n            error.Message,\n            StringComparison.Ordinal);')
          text = text.replace(
              'Assert.Contains("inventory", error.Message, StringComparison.OrdinalIgnoreCase);',
              'Assert.Contains("between four and sixty-four", error.Message, StringComparison.OrdinalIgnoreCase);')
          path.write_text(text)
          PY
          rm .github/workflows/a2-test-assertion-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Trureturing.Paper.Tests/PaperTheoryDeepeningAgentTests.cs .github/workflows/a2-test-assertion-fix.yml
          git commit -m "test(paper): align A2 fail-closed assertions"
          git push origin HEAD:codex/paper-a2-native-agent
