name: a2-contract-count-fix

on:
  push:
    branches:
      - codex/paper-a2-native-agent

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-a2-native-agent
          fetch-depth: 0
      - name: Update A2 contract bounds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Trureturing.Paper.Core/PaperTheoryDeepening.cs')
          text = path.read_text()
          old = 'RequireDigestList(contract.ExactInputRefs, "exact_input_refs", 3, 4);'
          new = 'RequireDigestList(contract.ExactInputRefs, "exact_input_refs", 7, 8);'
          if old not in text:
              raise SystemExit('A2 exact-input contract bound not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          rm .github/workflows/a2-contract-count-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Trureturing.Paper.Core/PaperTheoryDeepening.cs .github/workflows/a2-contract-count-fix.yml
          git commit -m "fix(paper): admit the complete A2 evidence closure"
          git push origin HEAD:codex/paper-a2-native-agent
