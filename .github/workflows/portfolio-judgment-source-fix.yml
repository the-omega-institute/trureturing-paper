name: portfolio-judgment-source-fix

on:
  push:
    branches:
      - codex/paper-portfolio-native-judgment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paper-portfolio-native-judgment
          fetch-depth: 0
      - name: Apply narrow source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Trureturing.Paper.Core/PaperPortfolioJudgmentAgents.cs')
          text = path.read_text()
          for name in (
              'PaperPortfolioJudgmentPaperContext',
              'PaperPortfolioJudgmentContext',
              'PaperPortfolioJudgmentComputation',
          ):
              text = text.replace(
                  f'internal sealed record {name}(',
                  f'public sealed record {name}(')
          old = '''        if (!string.Equals(cursor.ResultRef, ByteReference(CanonicalJson.Serialize(result)), StringComparison.Ordinal)
            || !string.Equals(cursor.Status, result.Status, StringComparison.Ordinal)'''
          new = '''        if (!string.Equals(cursor.Status, result.Status, StringComparison.Ordinal)'''
          if old not in text:
              raise SystemExit('result-ref correction target not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Trureturing.Paper.Core/PaperPortfolioJudgmentAgents.cs
          git commit -m "fix(paper): separate portfolio byte and domain identities"
          git push origin HEAD:codex/paper-portfolio-native-judgment
